
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Toon</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eadcff, #fff0f7);
            color: #49365f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .profile-card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 35px #8063a533;
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #e4d1ff;
        }

        h1 {
            color: #8b5fc7;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #a17acb;
            margin-bottom: 25px;
        }

        .info {
            background: #faf5ff;
            border-radius: 15px;
            padding: 18px;
            text-align: left;
            margin: 20px 0;
        }

        .info h2 {
            color: #8b5fc7;
            font-size: 20px;
            text-align: center;
        }

        .skill {
            background: #f4eaff;
            padding: 15px;
            border-radius: 15px;
            margin-top: 15px;
        }

        .skill h3 {
            margin-top: 0;
        }

        .footer {
            color: #a17acb;
            font-size: 13px;
            margin-top: 25px;
        }
    </style>
</head>

<body>
    <div class="profile-card">

        <!-- เปลี่ยน profile.jpg เป็นชื่อไฟล์รูปของตัวเอง -->
        <img src="img/1.jpg.png" alt="รูปโปรไฟล์ของตูน"
             class="profile-img">

        <h1>MY PROFILE</h1>
        <p class="subtitle">สวัสดี ยินดีต้อนรับสู่โปรไฟล์ของฉัน ♡</p>

        <div class="info">
            <h2>👤 ข้อมูลส่วนตัว</h2>
            <p><strong>ชื่อ:</strong> ตูน</p>
            <p><strong>ชื่อเล่น:</strong> กาน</p>
        </div>

        <div class="info">
            <h2>✨ ความสามารถพิเศษ</h2>

            <div class="skill">
                <h3>🎨 การวาดรูป</h3>
                <p>
                    ฉันชื่นชอบการวาดรูปและการสร้างสรรค์
                    ผลงานศิลปะ มีความสุขเมื่อได้ถ่ายทอด
                    จินตนาการผ่านภาพวาด
                </p>
            </div>
        </div>

        <p class="footer">
            © 2026 My Profile | Created by Kaan
        </p>

    </div>
</body>
</html>
